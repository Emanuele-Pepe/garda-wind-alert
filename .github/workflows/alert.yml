name: wind-alert

on:
  schedule:
    # GitHub cron is UTC: 04:10 UTC = 06:10 Rome in summer (05:10 in winter).
    # Scheduled runs can be delayed by several minutes; don't rely on exact timing.
    - cron: "10 4 * * *"
  workflow_dispatch: # manual "Run workflow" button, for testing

permissions:
  contents: write # needed to commit the forecast log

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev

      - name: Run alert
        run: uv run garda-wind-alert
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}

      # Daily commit also keeps the repo "active": GitHub disables scheduled
      # workflows after 60 days without repository activity.
      - name: Commit forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts.csv
          git diff --cached --quiet || git commit -m "data: forecast log $(date -u +%F)"
          git push
